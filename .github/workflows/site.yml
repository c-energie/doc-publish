# Renders the Quarto site and deploys to GitHub Pages.
#
# DELIBERATELY GATED to manual dispatch: the site contains the full document, and this
# repo is the public engine - the document it renders is private and reachable only
# with DOC_REPO_TOKEN. Do not add push/PR triggers, and do not enable Pages, until
# gates recorded in the document's own publishing.md have cleared. Running this
# workflow today will render
# fine and then fail at the deploy step unless Pages has been enabled - that is the
# intended failure mode.
#
# The document is named by the DOCUMENT_REPO *variable* (Settings -> Secrets and
# variables -> Actions -> Variables), not by a literal here: this repo is public and the
# document usually is not, so its name does not belong in the source. A variable rather
# than a secret because a repo slug is not a credential, and secret masking would garble
# it in the logs exactly when a checkout failure needs reading.
name: site
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # An unset variable expands to an empty string, and checkout then fails on a slug
      # it cannot parse - or worse, falls back to this repo, and the build reports "no
      # main.tex" two steps later, naming the wrong cause. Fail here, naming the setting,
      # the way config.py does for everything else.
      - name: Require DOCUMENT_REPO
        run: |
          test -n "${{ vars.DOCUMENT_REPO }}" || {
            echo "::error::DOCUMENT_REPO is not set - it should be the owner/name of the LaTeX document repo"
            exit 1
          }

      - name: Check out the document source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DOCUMENT_REPO }}
          token: ${{ secrets.DOC_REPO_TOKEN }}
          path: thesis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Install doc-publish
        run: pip install .

      # State (page plan, anchor map, signposts) rides along in the document checkout
      # under .doc-publish/, so anchors stay stable without extra wiring here.
      - name: Build corpus and site
        env:
          DOC_REPO: ${{ github.workspace }}/thesis
        run: |
          doc-publish build
          doc-publish site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
